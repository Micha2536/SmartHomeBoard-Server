[env:m5paper]
platform = espressif32@^5.1.0
board = m5stack-fire
framework = arduino

platform_packages =
    platformio/framework-arduinoespressif32@3.20004.0

upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default_16MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    m5stack/M5EPD@^0.1.5
    bblanchon/ArduinoJson@^7.0.0
